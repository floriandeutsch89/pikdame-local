# Pik Dame - Kubernetes Deployment
#
# IMPORTANT: replicas MUST stay 1. Game sessions live in process memory - the
# server is deliberately a single-instance stateful app. PostgreSQL is
# mandatory: the URL comes from the Secret pikdame-db (see k8s/README.md). "strategy: Recreate" prevents
# two pods from ever writing to the same volume during an update; the
# session snapshot + restore mechanism bridges the short restart gap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pikdame
  labels:
    app: pikdame
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pikdame
  template:
    metadata:
      labels:
        app: pikdame
    spec:
      # Mirror of the OWASP hardening used in docker-compose
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: pikdame
          image: ghcr.io/floriandeutsch89/pikdame-local:latest # pin :vX.Y.Z in production
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: PIKDAME_MAX_SESSIONS
              value: "200"
            - name: PIKDAME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pikdame-db
                  key: url
            # Legal page (§ 5 DDG): provider data, kept out of the repo. Unset =
            # /impressum.html shows "Impressum nicht konfiguriert".
            # - name: PIKDAME_IMPRINT_NAME
            #   value: "Max Muster"
            # - name: PIKDAME_IMPRINT_STREET
            #   value: "Musterstraße 1"
            # - name: PIKDAME_IMPRINT_CITY
            #   value: "12345 Musterstadt"
            # - name: PIKDAME_IMPRINT_EMAIL
            #   value: "impressum@example.org"
            # - name: PIKDAME_IMPRINT_COUNTRY # optional, default Deutschland
            #   value: "Deutschland"
            # Secrets (SMTP, base URL, optional PIKDAME_BIRTHDAY) via a Secret - see k8s/README.md:
            # envFrom:
            #   - secretRef:
            #       name: pikdame-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pikdame-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
