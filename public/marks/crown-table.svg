        <path d="M30 118H170" stroke-width="3.6"/>
        <path d="M30 136Q100 147 170 136" stroke-width="2.8"/>
      </g>
      <g fill="#000">
        <ellipse cx="100" cy="127.5" rx="8.5" ry="6"/>
        <path d="M73 121.5 79 127.5 73 133.5 67 127.5ZM127 121.5 133 127.5 127 133.5 121 127.5Z"/>
        <circle cx="49" cy="127" r="4"/><circle cx="151" cy="127" r="4"/>
        <path d="M100 62 106.5 77 100 92 93.5 77Z"/>
        <circle cx="64" cy="90" r="3.6"/><circle cx="136" cy="90" r="3.6"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(0 4)">
    <g mask="url(#cut)">
      <path d="M38 119C33 98 29 78 26 58C34 76 46 90 57 97C60 87 62 78 64 68C70 82 77 92 84 98C90 80 96 60 100 38C104 60 110 80 116 98C123 92 130 82 136 68C138 78 140 87 143 97C154 90 166 76 174 58C171 78 167 98 162 119Z"/>
