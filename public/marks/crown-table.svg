    <circle cx="26" cy="52" r="7"/><circle cx="64" cy="62" r="6"/><circle cx="100" cy="31" r="8.5"/><circle cx="136" cy="62" r="6"/><circle cx="174" cy="52" r="7"/>
  </g>
</svg>
