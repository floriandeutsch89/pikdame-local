        <path transform="translate(100 131.7) scale(.56)" d="M0 29C-9 20-29 6-29-9C-29-20-21-27-13.5-27C-7-27-2.5-22.5 0-17C2.5-22.5 7-27 13.5-27C21-27 29-20 29-9C29 6 9 20 0 29Z"/>
        <path transform="translate(58 88.6) scale(.56)" d="M-2.5 7.9A12.5 12.5 0 1 1-11.05-9.15A12.5 12.5 0 1 1 11.05-9.15A12.5 12.5 0 1 1 2.5 7.9Z"/>
      </g>
      <circle cx="100" cy="90" r="83" fill="none" stroke="#000" stroke-width="2.4"/>
    </mask>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
