    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="180">
      <rect width="200" height="180" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round">
        <path transform="translate(100 46.6) scale(.56)" d="M0-31C6-21 27-9 27 5C27 15 19 21 11 20C7.6 19.6 4.8 17.8 3 15H-3C-4.8 17.8-7.6 19.6-11 20C-19 21-27 15-27 5C-27-9-6-21 0-31Z"/>
