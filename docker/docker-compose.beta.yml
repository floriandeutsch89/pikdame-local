# Pik Dame - beta preview stack on its OWN host (docs/admin/beta.md), behind
# that host's caddy-crowdsec stack (site file: shared-caddy/beta.pikdame.caddy).
# Self-contained otherwise: own database and mail egress; nothing from prod.
# No Watchtower label: only the beta deploy updates it.
#   docker network create --internal caddy_beta_pikdame   # once
#   cp .env.beta.example .env && docker compose -f docker-compose.beta.yml up -d

name: pikdame-beta

services:
  pikdame-beta:
    image: ghcr.io/floriandeutsch89/pikdame-local:beta
    container_name: pikdame-beta
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=8080
      - PIKDAME_MAX_SESSIONS=20
      - PIKDAME_TRUST_PROXY=1
      - PIKDAME_ALLOWED_ORIGIN=https://${PIKDAME_BETA_DOMAIN:?set PIKDAME_BETA_DOMAIN in .env}
      # Also the passkey RP-ID.
      - PIKDAME_BASE_URL=https://${PIKDAME_BETA_DOMAIN}
      - PIKDAME_DATABASE_URL=postgres://pikdame@postgres-beta:5432/pikdame
      - PIKDAME_DATABASE_PASSWORD_FILE=/run/secrets/beta_db_password
      # Sign-up is e-mail-first, so beta needs real mail (own egress proxy).
      - PIKDAME_SMTP_HOST=smtp-egress-beta
      - PIKDAME_SMTP_PORT=${PIKDAME_SMTP_PORT:-587}
      - PIKDAME_SMTP_SECURE=${PIKDAME_SMTP_SECURE:-starttls}
      - PIKDAME_SMTP_TLS_SERVERNAME=${PIKDAME_SMTP_RELAY_HOST:-smtp.eu.mailgun.org}
      - PIKDAME_SMTP_USER=${PIKDAME_SMTP_USER:-}
      - PIKDAME_SMTP_PASS_FILE=/run/secrets/smtp_password
      - PIKDAME_MAIL_FROM=${PIKDAME_MAIL_FROM:-}
      - PIKDAME_ADMIN_TOKEN=${PIKDAME_BETA_ADMIN_TOKEN:-}
    secrets:
      - beta_db_password
      - smtp_password
    volumes:
      - beta-data:/app/data
    networks:
      caddy_beta_pikdame:
        aliases: [pikdame-beta] # upstream in the shared Caddy's site file
      beta: {}
      beta_smtp: {}
    depends_on:
      postgres-beta:
        condition: service_healthy
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

  postgres-beta:
    image: postgres:18-alpine
    container_name: pikdame-beta-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pikdame
      - POSTGRES_PASSWORD_FILE=/run/secrets/beta_db_password
      - POSTGRES_DB=pikdame
    secrets:
      - beta_db_password
    volumes:
      - beta-pgdata:/var/lib/postgresql
    networks:
      - beta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikdame -d pikdame"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true

  smtp-egress-beta:
    image: alpine/socat:latest
    container_name: pikdame-beta-smtp-egress
    restart: unless-stopped
    command: tcp-listen:587,fork,reuseaddr tcp-connect:${PIKDAME_SMTP_RELAY_HOST:-smtp.eu.mailgun.org}:${PIKDAME_SMTP_RELAY_PORT:-587}
    networks:
      - beta_smtp
      - egress
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    read_only: true

secrets:
  beta_db_password:
    file: ./secrets/beta_db_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

networks:
  # Shared Caddy <-> app only; owned by no stack.
  caddy_beta_pikdame:
    external: true
  beta:
    internal: true
  beta_smtp:
    internal: true
  # SMTP proxy only - never caddy_egress (next to CrowdSec's API)
  egress:

volumes:
  beta-data:
  beta-pgdata:
