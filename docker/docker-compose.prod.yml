# Pik Dame - production stack: app -> PostgreSQL, behind the shared Caddy.
#
#   cd docker
#   cp .env.example .env                     # domain, ACME e-mail, non-secrets
#   echo -n 'strong-password' > secrets/db_password.txt
#   echo -n 'smtp-password'   > secrets/smtp_password.txt   # optional
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets policy: real secrets live as compose FILE SECRETS (mounted at
# /run/secrets, never visible in `docker inspect`/environment); .env only
# carries non-sensitive configuration. See https://pik-dame.readthedocs.io/en/latest/admin/operations.html
#
# TLS, CrowdSec/AppSec, rate limits and Watchtower come from the host's shared
# Caddy stack (github.com/floriandeutsch89/caddy-crowdsec); this stack only
# joins its app network. Once per host, before the first start (docs/admin/shared-caddy.md):
#   docker network create --internal caddy_play_pikdame
#
# Network layout (least privilege):
#   caddy_play_pikdame - external, internal: shared Caddy <-> app only
#   pikdame            - internal: app <-> PostgreSQL only
#   pikdame_smtp       - internal: app <-> SMTP egress proxy only
#   pikdame_egress     - internet for the SMTP proxy only (never caddy_egress:
#                        it sits next to CrowdSec's API)

services:
  pikdame:
    image: ghcr.io/floriandeutsch89/pikdame-local:latest # pin :vX.Y.Z in production
    # --- Bots ------------------------------------------------------------------
    # The trained ONNX policies are built into the image and active by default
    # (PIKDAME_ONNX=1); heuristic bots: add `- PIKDAME_ONNX=0` to `environment`.
    # Measured under the limits below (2 games vs zen bots): ~35 MB RAM - the
    # limits need no change.
    #
    # Verify after deploy:
    #   docker compose logs pikdame | grep -E "ONNX-Bots|ONNX-Modell"
    # Details: docs/admin/onnx.md
    container_name: pikdame
    restart: unless-stopped
    stop_grace_period: 30s
    # No published ports - only the shared Caddy reaches the app.
    environment:
      - PORT=8080
      - PIKDAME_MAX_SESSIONS=200
      - PIKDAME_TRUST_PROXY=1
      - PIKDAME_ALLOWED_ORIGIN=https://${PIKDAME_DOMAIN:?set PIKDAME_DOMAIN in .env}
      - PIKDAME_BASE_URL=https://${PIKDAME_DOMAIN}
      # Secret-free URL - the password is injected from the secret file.
      - PIKDAME_DATABASE_URL=postgres://pikdame@postgres:5432/pikdame
      - PIKDAME_DATABASE_PASSWORD_FILE=/run/secrets/db_password
      # SMTP through the egress proxy (the app has no internet route; the
      # proxy can only reach ONE destination). TLS is verified against the
      # REAL mail server name, not the proxy hostname - which is why the
      # relay host below feeds BOTH the socat target and this servername.
      # Setting it in only one of the two places used to silently break the
      # certificate check.
      - PIKDAME_SMTP_HOST=${PIKDAME_SMTP_HOST:-smtp-egress}
      - PIKDAME_SMTP_PORT=${PIKDAME_SMTP_PORT:-587}
      - PIKDAME_SMTP_SECURE=${PIKDAME_SMTP_SECURE:-starttls}
      - PIKDAME_SMTP_TLS_SERVERNAME=${PIKDAME_SMTP_RELAY_HOST:-smtp.eu.mailgun.org}
      - PIKDAME_SMTP_USER=${PIKDAME_SMTP_USER:-}
      - PIKDAME_SMTP_PASS_FILE=/run/secrets/smtp_password
      - PIKDAME_MAIL_FROM=${PIKDAME_MAIL_FROM:-}
      # --- Admin page (optional): /admin shows the config report and can send
      #     a test mail. Off while unset. Value = Argon2id hash of the admin
      #     password, made with `docker compose exec pikdame node game/AdminToken.js`;
      #     in .env inside SINGLE quotes. Or PIKDAME_ADMIN_TOKEN_FILE for a secret.
      #     Docs: docs/admin/admin-page.md
      - PIKDAME_ADMIN_TOKEN=${PIKDAME_ADMIN_TOKEN:-}
      #
      # DIRECT SMTP instead of the proxy: set in .env
      #     PIKDAME_SMTP_HOST=smtp.eu.mailgun.org
      # and give this service an internet route by adding "pikdame_egress: {}"
      # to its networks: block below. That drops the app's "no outbound
      # route" property - a deliberate trade, not an accident: outbound 587
      # to one relay is a small surface, and it removes the proxy as a
      # failure source. The socat service can then be deleted.
    secrets:
      - db_password
      - smtp_password
    volumes:
      - pikdame-data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      caddy_play_pikdame:
        aliases: [pikdame] # upstream in the shared Caddy's site file
      pikdame: {}
      pikdame_smtp: {}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

  # SMTP egress proxy: the ONLY path from the app towards the internet, and
  # it can only reach ONE destination. The app itself stays on internal
  # networks without any route to the outside.
  # The destination comes from the SAME variable the app verifies its TLS
  # certificate against (PIKDAME_SMTP_RELAY_HOST) - two hardcoded copies of
  # one fact are a trap: change the provider here and the certificate check
  # keeps validating against the old name.
  smtp-egress:
    image: alpine/socat:latest
    container_name: pikdame-smtp-egress
    restart: unless-stopped
    command: tcp-listen:587,fork,reuseaddr tcp-connect:${PIKDAME_SMTP_RELAY_HOST:-smtp.eu.mailgun.org}:${PIKDAME_SMTP_RELAY_PORT:-587}
    networks:
      - pikdame_smtp
      - pikdame_egress
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    read_only: true

  postgres:
    image: postgres:18-alpine
    container_name: pikdame-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pikdame
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=pikdame
    secrets:
      - db_password
    volumes:
      # postgres:18 image: mount point is /var/lib/postgresql (PGDATA lives
      # in a versioned subdirectory to ease future pg_upgrade)
      - pikdame-pgdata:/var/lib/postgresql
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - pikdame
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikdame -d pikdame"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

# File secrets are bind mounts and keep the HOST file's owner and mode.
# The app runs as UID 10001 (non-root) - the files must be readable for it:
#   chown 10001:10001 secrets/*.txt && chmod 400 secrets/*.txt
# (postgres reads its secret as root during init, so it is unaffected)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

networks:
  # Owned by no stack, so the shared Caddy and this stack redeploy independently.
  caddy_play_pikdame:
    external: true
  # App <-> database only - no internet route
  pikdame:
    internal: true
  # App <-> SMTP egress proxy only - no internet route for the app itself
  pikdame_smtp:
    internal: true
  # Internet for the SMTP proxy only
  pikdame_egress: {}

volumes:
  pikdame-data:
  pikdame-pgdata:
