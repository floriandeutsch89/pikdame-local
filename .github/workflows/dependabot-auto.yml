# Everything Dependabot itself cannot do for this repository:
#
#   1. The changelog fragment changes/deps-<PR>.md (### Changed, German line,
#      <!-- bump: patch --> for patch updates). Without it the CI check
#      changelog-fragment fails, and the update would never reach a release:
#      release-pr.yml turns the fragments on main into the next version.
#      (Skipped for github-actions/terraform/pip: they do not change the
#      shipped artifact.)
#   2. Auto-merge for minor/patch updates once every check is green.
#      MAJOR updates (new Node base image, Postgres major, ...) are never
#      merged automatically - they get a reviewer and wait for a human.
#
# Acts through a GitHub App token, not GITHUB_TOKEN: a push or merge made
# with GITHUB_TOKEN triggers no workflow (GitHub's recursion guard), so the
# fragment commit would never be tested and the merge would never reach
# release-pr.yml. An App token has no expiry date - the former WORKFLOW_PAT
# had to be renewed by hand whenever it ran out.
#
# Setup (once):
#   1. Register a GitHub App on the account, permissions
#      "Contents: Read and write" + "Pull requests: Read and write",
#      install it on this repository.
#   2. Store App ID and private key as *Dependabot* secrets (Settings ->
#      Secrets and variables -> Dependabot): DEPS_BOT_APP_ID,
#      DEPS_BOT_PRIVATE_KEY. Actions secrets are invisible to workflow runs
#      triggered by Dependabot PRs - this must be the Dependabot store.
#      (release-pr.yml needs the same two as *Actions* secrets.)
name: dependabot-auto

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}

      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}

      # Pushing our own commit fires another `synchronize` event - without this
      # guard the workflow would commit again on every loop. The old marker
      # stands for a branch that still got a version bump.
      - name: Changelog fragment
        id: fragment
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          if git log -1 --pretty=%B | grep -qE '\[deps-(changelog|version-bump)\]'; then
            echo "Changelog commit already on the branch - nothing to do."
            exit 0
          fi
          case "$ECOSYSTEM" in
            github_actions|terraform|pip)
              echo "$ECOSYSTEM does not change the shipped artifact - no changelog fragment."
              exit 0
              ;;
          esac
          if [ ! -f changes/README.md ]; then
            echo "::error::This branch predates changelog fragments - comment '@dependabot rebase' on the PR."
            exit 1
          fi
          case "$ECOSYSTEM" in
            docker*) KIND=docker ;;
            *) KIND=npm ;;
          esac
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then LEVEL=patch; else LEVEL=minor; fi
          LIST=$(node -e '
            const d = JSON.parse(process.env.DEPS_JSON || "[]");
            console.log(d.map((x) => x.prevVersion && x.newVersion
              ? `${x.dependencyName} ${x.prevVersion}→${x.newVersion}`
              : x.dependencyName).join(", "));
          ')
          [ -n "$LIST" ] || LIST="$PR_TITLE"
          FRAGMENT=$(node scripts/bump-deps.js "$LIST" --pr="$PR_NUMBER" --level="$LEVEL" --kind="$KIND")
          git add "$FRAGMENT"
          if git diff --cached --quiet; then
            echo "$FRAGMENT is already up to date - nothing to commit."
            exit 0
          fi
          git config user.name "pikdame-deps-bot"
          git config user.email "deps-bot@pikdame.local"
          git commit -m "chore(deps): changelog fragment [deps-changelog]" -m "${LIST}"
          git push origin "HEAD:${HEAD_REF}"
          echo "fragment=$FRAGMENT" >> "$GITHUB_OUTPUT"

      # Minor/patch: GitHub merges the PR itself as soon as the required
      # checks pass. Needs "Allow auto-merge" plus required status checks on
      # main - without required checks GitHub would merge INSTANTLY.
      - name: Enable auto-merge (minor/patch)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"

      - name: Major update - hand over to a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR" --add-label "needs-review" --add-reviewer floriandeutsch89 \
            || echo "labelling/reviewer request failed (non-fatal)"
          gh pr comment "$PR" --body "🛑 **Major-Update - kein Auto-Merge.**

          Dieser PR hebt eine Hauptversion an (${{ steps.meta.outputs.dependency-names }}). Bitte manuell prüfen. Bei einem neuen Node-Basis-Image gehören in denselben PR:
          - \`docker/Dockerfile\` (FROM-Zeilen)
          - \`.github/workflows/ci.yml\`: \`node-version\` und die Prüfung \`grep -q \"FROM node:26\"\`

          Bei npm- und Docker-Updates legt dieser Workflow das Changelog-Fragment \`changes/deps-${{ github.event.pull_request.number }}.md\` selbst an; Version und CHANGELOG entstehen erst im Release-PR."
