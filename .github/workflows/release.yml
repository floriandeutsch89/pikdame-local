name: Release

# On every push to main: if the version in package.json has no git tag yet,
# the workflow automatically creates:
# 1. Git tag vX.Y.Z + GitHub release (notes = matching CHANGELOG section)
# 2. Docker image on GHCR: ghcr.io/<owner>/pikdame-local:latest + :vX.Y.Z
#    (Debian slim, trained ONNX bots built in - the one image)
#    (amd64 + arm64 - also runs on Raspberry Pi & Apple Silicon)
# Prod's reverse proxy is the shared Caddy stack (docs/admin/shared-caddy.md);
# only beta still builds a Caddy image (beta.yml).

on:
  push:
    branches: [main]

# One run at a time: two merges seconds apart both saw "no tag yet" and the second
# failed creating it (v2.132.2). Queued, the second run finds the tag and skips.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tag + release
  packages: write # GHCR push

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read version + check whether the tag already exists
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists - no new release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "New version: v$VERSION"
          fi

  release:
    needs: meta
    if: needs.meta.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          # Cut the "## [X.Y.Z]" section up to the next "## ["
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." > release-notes.md
          fi
          echo "--- Notes for v$VERSION ---"; cat release-notes.md
      - name: Create tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          gh release create "v$VERSION" \
            --title "Pik Dame v$VERSION" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

  helm-chart:
    needs: [meta, release]
    if: needs.meta.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package chart (version = app version)
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          helm package helm/pikdame --version "$VERSION" --app-version "$VERSION"
      - name: Push chart to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "pikdame-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # One job per architecture on a NATIVE runner (no QEMU), pushed by digest;
  # docker-manifest joins them under the version tags.
  docker:
    needs: [meta, release]
    if: needs.meta.outputs.is_new == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache: type=gha # the scope CI and beta fill for this commit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: type=gha,scope=arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GHCR login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # OCI labels: make version + commit traceable on the registry
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Supply chain: SLSA provenance and an SBOM travel with the image.
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache }}
          cache-to: ${{ matrix.cache }},mode=max
      - name: Hand the digest to docker-manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [meta, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # tag the manifest list, push the attestation
      id-token: write # sign the attestation (Sigstore, no stored key)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: GHCR login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag amd64 + arm64 as one image
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" = "2" ] || { echo "::error::expected two digests, got: $(ls)"; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:v$VERSION" $(printf "$IMAGE@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:v$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      # Verifiable with: gh attestation verify oci://ghcr.io/<repo>:vX.Y.Z --repo <repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Roll the new image out right away instead of waiting for Watchtower's
  # nightly run. No-op until DEPLOY_HOST is configured (docs/admin/auto-deploy.md).
  deploy:
    needs: [meta, docker-manifest]
    if: needs.meta.outputs.is_new == 'true'
    # A called workflow never gets more permissions than its caller grants.
    permissions:
      contents: read
      id-token: write # deploy.yml joins the tailnet
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets: inherit
