name: Beta

# Every push to a pull request rolls out to the beta preview
# (beta.pikdame.online): build the image from the PR head, push it to GHCR as
# :beta, then hand the commit id to the server over SSH. ONE slot - the most
# recent push wins. The PR shows the deployment ("View deployment") through
# the `beta` environment.
#
# Off until the repository variables DEPLOY_HOST and BETA_URL are set - the
# job is then skipped (grey), never red. BETA_URL is the switch and is set
# LAST, after the `beta` environment and its secrets exist: GitHub cannot test
# for an environment in `if:`, and a job that names a missing one silently
# creates it empty. Setup: docs/admin/beta.md.
#
# Who never reaches beta:
#   * fork PRs - the repository is public, and a fork must not get a deploy
#     key or GHCR write access. Plain `pull_request` already withholds both;
#     the head-repo check below makes the skip explicit instead of a red run.
#     NEVER switch this to `pull_request_target`.
#   * Dependabot branches - a dependency bump would push the feature you are
#     testing off the slot.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write # push :beta to GHCR

# Never cancel a running rollout halfway (compose up mid-way). GitHub keeps at
# most one PENDING run per group and replaces it with each newer push, so a
# burst of pushes still ends on the last one.
concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  beta:
    if: >-
      vars.DEPLOY_HOST != '' && vars.BETA_URL != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: beta
      url: ${{ vars.BETA_URL }}
    env:
      # The commit you pushed, not GitHub's synthetic merge commit - that is
      # what the image revision, the server check and the logs refer to.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Version of this commit
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: that is the server (terraform: x86 on purpose). The arm64
      # leg under QEMU would triple the wait for nothing.
      - name: Build & push :beta
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:beta
          # The server compares this label with the commit it was handed.
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          # Reads main's cache (PRs may), writes its own PR-scoped entries.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set in the 'beta' environment (docs/admin/beta.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The beta key is forced to `pikdame-deploy beta` on the server; it
          # sends only the commit id.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              -p "${{ vars.DEPLOY_PORT || '22' }}" \
              "${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}" \
              "$HEAD_SHA"

      - name: Wait for beta on /statusz
        run: |
          WANT="${{ steps.v.outputs.version }}"
          URL="${{ vars.BETA_URL }}/statusz"
          for i in $(seq 1 36); do
            GOT=$(curl -fsS --max-time 5 "$URL" | jq -r 'select(.status == "ok") | .version' 2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Beta live: v$GOT (${HEAD_SHA:0:7}) - ${{ vars.BETA_URL }}"
              exit 0
            fi
            echo "Waiting for v$WANT (got: ${GOT:-no answer}) ..."
            sleep 5
          done
          echo "::error::$URL does not answer with v$WANT after 3 minutes"
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
