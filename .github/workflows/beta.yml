name: Beta

# Every PR push -> :beta images -> beta host (one slot, latest wins).
# Own server, never the prod host. Skipped until BETA_HOST and BETA_URL are
# set; set BETA_URL last, a job naming a missing environment creates it
# empty. Setup: docs/admin/beta.md
# Forks and dependabot/ branches never deploy - never use pull_request_target.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write # push the :beta images to GHCR

# Never cut a rollout off; newer pushes replace the one pending run.
concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  beta:
    if: >-
      vars.BETA_HOST != '' && vars.BETA_URL != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: beta
      url: ${{ vars.BETA_URL }}
    env:
      # The pushed commit, not GitHub's merge commit.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Version of this commit
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only - the server is x86.
      - name: Build & push :beta
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:beta
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proxy with this commit's Caddyfile, so the CSP hash always matches.
      - name: Build & push Caddy :beta
        uses: docker/build-push-action@v7
        with:
          context: docker/caddy
          file: docker/caddy/Dockerfile.beta
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-caddy:beta
          labels: |
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          cache-from: type=gha,scope=caddy-beta
          cache-to: type=gha,mode=max,scope=caddy-beta

      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set in the 'beta' environment (docs/admin/beta.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              -p "${{ vars.BETA_PORT || '22' }}" \
              "${{ vars.BETA_USER || 'deploy' }}@${{ vars.BETA_HOST }}" \
              "$HEAD_SHA"

      - name: Wait for beta on /statusz
        run: |
          WANT="${{ steps.v.outputs.version }}"
          URL="${{ vars.BETA_URL }}/statusz"
          for i in $(seq 1 36); do
            GOT=$(curl -fsS --max-time 5 "$URL" | jq -r 'select(.status == "ok") | .version' 2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Beta live: v$GOT (${HEAD_SHA:0:7}) - ${{ vars.BETA_URL }}"
              exit 0
            fi
            echo "Waiting for v$WANT (got: ${GOT:-no answer}) ..."
            sleep 5
          done
          echo "::error::$URL does not answer with v$WANT after 3 minutes"
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
