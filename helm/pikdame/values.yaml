# Default values for the pikdame chart.

image:
  repository: ghcr.io/floriandeutsch89/pikdame-local
  # Pin a concrete version in production (e.g. "v1.14.0"); "latest" only for testing.
  tag: latest
  pullPolicy: IfNotPresent

# IMPORTANT: keep this at 1. Game sessions live in process memory - multiple
# replicas would be independent servers that know nothing about each other. The deployment
# uses strategy Recreate so two pods never share the volume during updates.
replicaCount: 1

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  host: spiel.pikdame.online
  # Long-lived WebSocket connections
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: false
    secretName: pikdame-tls

persistence:
  size: 1Gi
  # storageClassName: ""
  # Use an existing PVC instead of creating one:
  # existingClaim: my-claim

env:
  maxSessions: "200"

# Bots: the image has the trained ONNX policies built in and uses them by
# default. false = heuristic bots (sets PIKDAME_ONNX=0; the image itself
# presets 1, so "off" has to be explicit).
onnx:
  enabled: true

# Legal page (Impressum, § 5 DDG): provider data from the environment, kept out
# of the public repo. Empty values are not set, so they may also come from
# existingSecret. While name, street, city or e-mail is missing,
# /impressum.html shows "Impressum nicht konfiguriert" and /admin warns.
imprint:
  name: "" # e.g. Max Muster
  street: "" # e.g. Musterstraße 1
  city: "" # e.g. 12345 Musterstadt
  email: "" # e.g. impressum@example.org
  country: "" # empty = Deutschland

# PostgreSQL is mandatory (the server does not start without it). Recommended:
# a managed/operator database. Reference an existing Secret that carries the
# full URL (default: pikdame-db, key url) or set the URL directly (ends up in
# the pod spec!) and clear existingSecret.
database:
  url: ""
  existingSecret: "pikdame-db" # Secret name
  existingSecretKey: "url" # key inside that Secret holding postgres://...
# Name of an existing Secret with production env vars (PIKDAME_BASE_URL,
# PIKDAME_SMTP_* - see k8s/README.md). Leave empty to run without it.
existingSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Hardened defaults (mirror of the OWASP setup) - override only if you
# know why.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
